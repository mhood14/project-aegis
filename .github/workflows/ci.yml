name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-security-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SupportingDocs/app_hybrid_search

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            SupportingDocs/app_hybrid_search/requirements.txt
            SupportingDocs/app_hybrid_search/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Bandit security scan
        run: bandit -q -r aegis_app app.py

      - name: Run dependency audit
        run: pip-audit -r requirements.txt

  repository-artifact-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate KQL detections have documentation
        run: |
          set -euo pipefail
          missing=0
          for kql in kql-detections/detections/**/*.kql; do
            md="${kql%.kql}.md"
            if [ ! -f "$md" ]; then
              echo "Missing documentation for $kql"
              missing=1
            fi
          done
          exit "$missing"
